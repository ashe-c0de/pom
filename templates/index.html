<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pomodoro Timer</title>

    <link rel="icon" type="image/svg+xml" href="{{ get_url(path='favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ get_url(path='css/style.css') }}">
</head>

<body>
    <div class="quote-top">Don't count the days, make the days count.</div>
    <a href="https://ashe-wiki.github.io/" class="days-left-link">
        <div id="days-left" class="days-left"></div>
    </a>
    <a href="https://github.com/ashe-c0de/pom" class="github-link">
        <svg viewBox="0 0 24 24" fill="currentColor" width="28" height="28">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
    </a>

    <main class="timer">
        <div class="timer__frame">
            <svg class="timer__border" viewBox="0 0 660 620" fill="none">
                <path d="M 35,18 
                         L 160,35 L 330,12 L 500,32 L 625,15
                         L 645,155 L 625,315 L 648,475 L 630,602
                         L 500,615 L 330,592 L 160,618 L 25,600
                         L 12,475 L 38,315 L 10,155 Z"
                      stroke="#edc3ae" stroke-width="1.5" fill="none" opacity="0.5" />
            </svg>
            <div class="timer__face">
                <svg class="timer__progress" viewBox="0 0 200 200">
                    <circle class="timer__track" cx="100" cy="100" r="90" />
                    <circle id="progress" class="timer__ring" cx="100" cy="100" r="90" />
                </svg>
                <div class="timer__info">
                    <div class="timer__label">FOCUS</div>
                    <div id="time" class="timer__time">25:00</div>
                </div>
                <button class="timer__option" data-minutes="5">5m</button>
                <button class="timer__option timer__option--active" data-minutes="25">25m</button>
                <button class="timer__option" data-minutes="60">60m</button>
            </div>
            <button id="skip" class="timer__button">Skip</button>
        </div>
    </main>

    <script src="{{ get_url(path='js/app.js') }}"></script>
</body>
</html>
